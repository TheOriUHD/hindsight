[workspace]
resolver = "2"
members = ["crates/capture", "crates/encode", "crates/recorder", "app"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
windows = "0.61"
windows-core = "0.61"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avcodec", "avformat"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
